services:
  - type: web
    name: nfl-hub-new-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port 10000
    autoDeploy: true
    plan: free
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /


